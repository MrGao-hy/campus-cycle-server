# 校园循环后端 · 开发环境配置
# dataId : campus-cycle-server-dev.yaml
# group  : CAMPUS_CYCLE

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_cycle}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 本机 MySQL 只有 root 账号（无 devuser），且 Nacos 配置优先级高于本地
    # application-dev.yml，所以这里的默认值必须与本地实际可用账号一致，
    # 否则会把本地配置覆盖成连不上的账号。可用环境变量 DB_USERNAME/DB_PASSWORD 覆盖。
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:gxh151}

logging:
  level:
    com.campus.cycle: debug

campus:
  wx:
    # 本地开发用 AppSecret（仅限本机；仓库公开请在微信公众平台重置）
    secret: c375c0d21fe3532bfa25965dbab70e9c
    # dev 默认走真实 code2session（同一微信账号稳定登录）；
    # H5/演示环境启动服务时加 WX_MOCK=true 即可临时切回 mock 登录
    mock: ${WX_MOCK:false}
