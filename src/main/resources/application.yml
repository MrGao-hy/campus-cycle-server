spring:
  application:
    name: campus-cycle-server
  profiles:
    active: dev
  # Nacos 配置中心：optional: 前缀表示 Nacos 不可用时静默跳过，本地 yml 兜底，
  # 保证无 Nacos 环境（CI / 新机器）也能直接启动
  config:
    import:
      - optional:nacos:campus-cycle-server.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        # public 命名空间的 id 为空字符串，留空即 public
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:CAMPUS_CYCLE}
        file-extension: yaml
        # 配置变更推送后自动刷新（@Value 字段需配合 @RefreshScope）
        refresh-enabled: true
      # 单体服务暂不做注册发现，接入配置中心即可
      discovery:
        enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 业务自定义配置
campus:
  jwt:
    # 生产环境务必通过环境变量覆盖，勿使用默认值
    secret: ${CAMPUS_JWT_SECRET:campus-cycle-dev-secret-change-me-please-0123456789}
    # token 有效期（毫秒）：默认 30 天
    expire-ms: ${CAMPUS_JWT_EXPIRE_MS:2592000000}
  wx:
    # 微信小程序登录（code2session），生产环境配置真实 appid/secret
    # appid 已填当前小程序 wx1d337ce3ce3bae15；secret 请在微信公众平台
    # （mp.weixin.qq.com → 开发 → 开发管理 → 开发设置 → AppSecret）获取，
    # 通过环境变量 WX_SECRET 注入，勿硬编码进配置文件
    appid: ${WX_APPID:wx1d337ce3ce3bae15}
    secret: ${WX_SECRET:}
    # mock 模式：为 true 时不调微信接口，按 code 直接签发测试 token（本地开发用）；
    # 配好 AppSecret 后置为 false 走真实 code2session（同一微信账号稳定登录）
    mock: ${WX_MOCK:true}
  scheduler:
    # 订单超时扫描间隔（毫秒）
    order-sweep-interval-ms: 60000
  upload:
    # 商品图片上传存储目录（相对工作目录；可通过环境变量覆盖）
    dir: ${CAMPUS_UPLOAD_DIR:./uploads}
